apiVersion: v1
kind: Namespace
metadata:
  name: webapi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webapi-images-pvc
  namespace: webapi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: webapi
  namespace: webapi
spec:
  type: NodePort
  selector:
    app: webapi
  ports:
    - name: http
      port: 8080
      nodePort: 30003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi-deployment
  namespace: webapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapi
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: webapi
    spec:
      containers:
        - name: webapi-container
          image: placeholder/mysql-webapi:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: root-password
            - name: IMAGE_STORAGE_PATH
              value: /images
          volumeMounts:
            - name: images-storage
              mountPath: /images
      volumes:
        - name: images-storage
          persistentVolumeClaim:
            claimName: webapi-images-pvc
