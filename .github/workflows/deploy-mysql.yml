name: Deploy MySQL to K3s

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    # Targets your self-hosted K3s ARC runner scale set
    runs-on: arc-runner-set
    container:
      image: ubuntu:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Set up the Kubernetes CLI (kubectl) on the runner
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      # 2. Configure kubectl access using your GitHub Config Secret
      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # 3. Safely inject the GitHub Secret into a Kubernetes Secret
      - name: Create MySQL Secret
        run: |
          kubectl create secret generic mysql-secrets \
            --namespace=mysql \
            --from-literal=root-password='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      # 4. Apply your updated mysql.yaml manifest
      - name: Deploy MySQL Resources
        run: |
          kubectl apply -f devops/infrastructure/mysql/mysql.yml

      # 5. Verify deployment rollouts
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/mysql-deployment -n mysql --timeout=60s
