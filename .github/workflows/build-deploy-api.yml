name: Hybrid CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Build & Push Image (Runs on GitHub Cloud)
  # ----------------------------------------------------
  build-image:
    runs-on: ubuntu-latest # Free GitHub-hosted runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Web API Image
        uses: docker/build-push-action@v5
        with:
          context: src/webapi
          file: src/webapi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mysql-webapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mysql-webapi:${{ github.sha }}

  # ----------------------------------------------------
  # JOB 2: Deploy to K3s (Runs on your local K3s hardware)
  # ----------------------------------------------------
  deploy-to-k3s:
    runs-on: arc-runner-set # Targets your self-hosted K3s agent
    needs: build-image      # Waits for Job 1 to finish successfully
    container:
      image: ubuntu:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create Namespace
        run: |
          kubectl create namespace webapi --dry-run=client -o yaml | kubectl apply -f -

      - name: Create MySQL Secret
        run: |
          kubectl create secret generic mysql-secrets \
            --namespace=webapi \
            --from-literal=root-password='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy WebAPI Resources
        run: |
          kubectl apply -f devops/infrastructure/webapi/webapi.yml

      - name: Update Image
        run: |
          kubectl set image deployment/webapi-deployment \
            webapi-container=${{ secrets.DOCKERHUB_USERNAME }}/mysql-webapi:${{ github.sha }} \
            -n webapi

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/webapi-deployment -n webapi --timeout=60s
